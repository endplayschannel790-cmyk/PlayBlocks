<script>
/* PlayBlocks branding */
document.title = "PlayBlocks — Build & Explore";

/* Give PlayBlocks its own saved data */
(function () {
  const originalGet = Storage.prototype.getItem;
  const originalSet = Storage.prototype.setItem;
  const originalRemove = Storage.prototype.removeItem;
  const originalKey = Storage.prototype.key;

  function convert(key) {
    if (typeof key === "string" && key.startsWith("pv_")) {
      return "pb_" + key.substring(3);
    }
    return key;
  }

  Storage.prototype.getItem = function(key) {
    return originalGet.call(this, convert(key));
  };

  Storage.prototype.setItem = function(key, value) {
    return originalSet.call(this, convert(key), value);
  };

  Storage.prototype.removeItem = function(key) {
    return originalRemove.call(this, convert(key));
  };

  Storage.prototype.key = function(index) {
    return originalKey.call(this, index);
  };
})();

/* Change visible PlayVerse branding */
function renamePlayBlocks() {
  document.title = "PlayBlocks — Build & Explore";

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  let node;
  while (node = walker.nextNode()) {
    if (node.nodeValue.includes("PlayVerse")) {
      node.nodeValue = node.nodeValue.replace(/PlayVerse/g, "PlayBlocks");
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  renamePlayBlocks();

  const observer = new MutationObserver(renamePlayBlocks);
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
});
</script>
