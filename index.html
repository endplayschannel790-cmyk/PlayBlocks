<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlayBlocks</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#080811;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  border:1px solid #3985ff;
  background:#17172e;
  color:white;
  border-radius:12px;
  padding:12px 16px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

/* HOME */

#app{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top right,#24245c 0%,transparent 35%),
    radial-gradient(circle at bottom left,#35115a 0%,transparent 35%),
    #080811;
  overflow:auto;
  z-index:10;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#0c0c19ee;
  border-bottom:1px solid #252542;
