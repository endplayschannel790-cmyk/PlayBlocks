<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlayBlocks</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080811;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
  font-family:inherit;
}

button{
  border:1px solid #3985ff;
  background:#17172e;
  color:white;
  border-radius:12px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

/* =========================
   HOME APP
========================= */

#app{
  position:fixed;
  inset:0;
  z-index:20;
  background:
    radial-gradient(circle at top right,#20205b55,transparent 35%),
    radial-gradient(circle at bottom left,#35105c55,transparent 35%),
    #080811;
  overflow:auto;
}

#app.hidden{
  display:none;
}

.app-header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #242442;
  background:#0c0c19dd;
  position:sticky;
  top:0;
  z-index:5;
  backdrop-filter:blur(15px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:23px;
  font-weight:900;
  color:#fff;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#3985ff,#984dff);
  box-shadow:0 0 25px #3985ff55;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:9px;
  background:#15152a;
  border:1px solid #2e2e52;
  padding:6px 11px 6px 6px;
  border-radius:30px;
  cursor:pointer;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:18px;
  background:linear-gradient(135deg,#3985ff,#984dff);
  border:2px solid #ffffff33;
}

#miniName{
  font-weight:bold;
  max-width:120px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.layout{
  display:flex;
  min-height:calc(100vh - 76px);
}

  padding:18px 12px;
