<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayBlocks</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* STARTUP SCREEN */
#startup {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

/* PLAYBLOCKS BLOB */
#blob {
  width: 150px;
  height: 150px;

  background: linear-gradient(
    135deg,
    #3985ff,
    #7c3aed,
    #984dff
  );

  border-radius:
    42% 58% 63% 37% /
    55% 43% 57% 45%;

  display: flex;
  align-items: center;
  justify-content: center;

  animation:
    blobSpin 1.4s ease-in-out infinite,
    blobPulse 1.4s ease-in-out infinite;

  box-shadow:
    0 0 35px rgba(57, 133, 255, 0.35),
    0 0 70px rgba(152, 77, 255, 0.2);
}

/* SIMPLE PLAY SYMBOL */
#blob::after {
  content: "";
  width: 0;
  height: 0;

  border-top: 28px solid transparent;
  border-bottom: 28px solid transparent;
  border-left: 42px solid white;

  margin-left: 8px;
}

/* LOOPING TWIRL */
@keyframes blobSpin {
  0% {
    transform: rotate(0deg) scale(1);
  }

  25% {
    transform: rotate(90deg) scale(1.06);
  }

  50% {
    transform: rotate(180deg) scale(0.94);
  }

  75% {
    transform: rotate(270deg) scale(1.06);
  }

  100% {
    transform: rotate(360deg) scale(1);
  }
}

@keyframes blobPulse {
  0%, 100% {
    border-radius:
      42% 58% 63% 37% /
      55% 43% 57% 45%;
  }

  50% {
    border-radius:
      58% 42% 38% 62% /
      44% 59% 41% 56%;
  }
}

/* ONLiNE STUDIOS TEXT */
#powered {
  position: absolute;

  color: white;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;

  opacity: 0;
  transform: scale(0.7);

  animation: showText 1.2s ease forwards;

  animation-delay: 4.2s;
}

@keyframes showText {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }

  60% {
    opacity: 1;
    transform: scale(1.08);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

/* HIDE BLOB BEFORE TEXT */
#blob {
  animation-delay: 0s;
}

#startup.finished {
  animation: fadeToBlack 0.8s ease forwards;
  animation-delay: 5.8s;
}

@keyframes fadeToBlack {
  to {
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="startup">

  <div id="blob"></div>

  <div id="powered">
    Powered by OnLine Studios
  </div>

</div>

<script>
const startup = document.getElementById("startup");
const blob = document.getElementById("blob");

/*
  After the PlayBlocks blob finishes,
  switch to the OnLine Studios text.
*/
setTimeout(() => {
  blob.style.animation = "none";
  blob.style.opacity = "0";
  blob.style.transform = "scale(0.5)";
  blob.style.transition = "opacity 0.5s ease, transform 0.5s ease";
}, 3800);

/*
  Finish startup and leave the player
  on a completely black screen.
*/
setTimeout(() => {
  startup.classList.add("finished");
}, 5800);

/*
  Keep the black screen after the animation.
*/
setTimeout(() => {
  startup.style.display = "none";
  document.body.style.background = "#000";
}, 6700);
</script>

</body>
</html>
