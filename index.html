<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b16">
<meta name="description" content="PlayBlocks — discover, play, and create games.">
<title>PlayBlocks — Play. Create. Explore.</title>
<style>
:root{--bg:#090b16;--panel:#121a2d;--panel2:#18213a;--line:#2b3858;--text:#f4f6ff;--muted:#9ba7c7;--blue:#3985ff;--purple:#984dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 80% 0%,#29205c66,transparent 60%),var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{height:100vh;position:sticky;top:0;padding:23px 15px;border-right:1px solid var(--line);background:#0c1020;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:900;padding:5px 10px 27px;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center}.brand span{background:linear-gradient(90deg,#b58aff,#64a5ff);color:transparent;background-clip:text}.navlabel{font-size:10px;letter-spacing:1.5px;color:#7180a3;font-weight:bold;padding:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:12px;border-radius:11px;color:var(--muted);font-weight:bold}.nav button.active,.nav button:hover{background:#47338b55;color:white}.sidebox{margin-top:auto;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.sidebox p{font-size:12px;color:var(--muted);line-height:1.5}.main{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:4;background:#0b1020ed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(15px,4vw,42px)}.mobilebrand{display:none;font-weight:900}.search{width:min(420px,55vw);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:white;outline:none}.topright{display:flex;align-items:center;gap:9px}.userbtn,.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.content{max-width:1450px;margin:auto;padding:30px clamp(15px,4vw,42px) 95px}.hero{border:1px solid #4a4b8b;border-radius:23px;padding:clamp(25px,4vw,42px);background:linear-gradient(115deg,#30205f,#1c3767 60%,#12465a);margin-bottom:27px;min-height:230px;display:flex;align-items:center}.hero>div{max-width:570px}.eyebrow{color:#b7a2ff;font-size:10px;font-weight:bold;letter-spacing:2px;margin-bottom:10px}.hero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px;margin:0 0 12px}.hero p{color:#d9e2ff;line-height:1.6;margin:0 0 20px}.btn{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:11px 15px;font-weight:bold}.primary{border:0;background:linear-gradient(100deg,var(--purple),var(--blue));color:white}.pagehead{margin-bottom:22px}.pagehead h1{font-size:32px;margin:0 0 7px}.pagehead p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 27px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.sectionhead h2{font-size:19px;margin:0}.sectionhead button{border:0;background:none;color:#b7a2ff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.game{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.art{height:140px;display:grid;place-items:center;font-size:53px;position:relative}.art:before{content:"";position:absolute;width:110px;height:110px;border:1px solid #ffffff25;border-radius:25px;transform:rotate(35deg)}.art span{z-index:1;filter:drop-shadow(0 7px 10px #0006)}.blue{background:linear-gradient(135deg,#17477c,#272b68)}.purple{background:linear-gradient(135deg,#642b83,#28285e)}.green{background:linear-gradient(135deg,#146353,#243a63)}.orange{background:linear-gradient(135deg,#984d2e,#4c2d69)}.pink{background:linear-gradient(135deg,#78355e,#3c326b)}.cyan{background:linear-gradient(135deg,#12637a,#293b78)}.gamebody{padding:14px}.game h3{margin:0 0 6px;font-size:15px}.game p{color:var(--muted);font-size:12px;line-height:1.5;min-height:36px;margin:0 0 12px}.gamefoot{display:flex;justify-content:space-between;align-items:center;gap:7px}.tag{font-size:10px;padding:5px 8px;border:1px solid #3b4b70;border-radius:30px;color:#c8d4f2}.play,.fav{border:1px solid #475b90;background:#25365d;border-radius:9px;padding:7px 10px;font-weight:bold;font-size:11px}.fav{padding:7px 9px}.empty{grid-column:1/-1;border:1px dashed #435071;padding:30px;border-radius:15px;text-align:center;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:15px}.panel p,.muted{color:var(--muted);font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;font-weight:bold}.field input,.field textarea,.field select{width:100%;padding:12px;background:#0d1425;border:1px solid var(--line);border-radius:10px;color:white;outline:none}.field textarea{min-height:85px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.avatar{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;font-size:25px;font-weight:bold}.achievement{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}.achievement:last-child{border:0}.medal{width:42px;height:42px;border-radius:13px;background:#33295e;display:grid;place-items:center;font-size:21px}.hidden{display:none!important}.mobile-nav{display:none}.modalbg{position:fixed;inset:0;background:#050711d9;z-index:20;display:grid;place-items:center;padding:15px}.modal{width:min(500px,100%);background:var(--panel);border:1px solid #46577c;border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#e8edff;color:#12182a;padding:11px 16px;border-radius:11px;font-weight:bold;font-size:12px;transition:.2s;z-index:30;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.light{--bg:#f2f4fb;--panel:#fff;--panel2:#edf0fa;--line:#d8deef;--text:#171c2d;--muted:#64708c;background:#f2f4fb;color:#171c2d}.light .sidebar,.light .topbar{background:#fff}.light .search,.light .userbtn,.light .iconbtn,.light .game,.light .panel,.light .stat{background:#fff;color:#171c2d}.light .field input,.light .field textarea,.light .field select{background:#f7f8fc;color:#171c2d}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.shell{display:block}.sidebar{display:none}.topbar{height:62px;padding:0 12px}.mobilebrand{display:block}.search{width:39vw;padding:10px}.userbtn{padding:8px}.content{padding:22px 13px 100px}.grid{gap:10px}.art{height:110px;font-size:42px}.gamebody{padding:10px}.game p{min-height:50px;font-size:11px}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:19px}.mobile-nav{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:10;justify-content:space-around;background:#0c1224f5;border-top:1px solid var(--line);padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:4px;justify-items:center}.mobile-nav b{font-size:18px}.mobile-nav button.active{color:#bba5ff}.row{grid-template-columns:1fr}.hero{min-height:225px;padding:24px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.art{height:130px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="logo">▶</div><span>PlayBlocks</span></div>
<div class="navlabel">DISCOVER</div>
<nav class="nav"><button class="active" data-page="home">⌂　Home</button><button data-page="games">▦　Games</button><button data-page="favorites">☆　Favorites</button><button data-page="create">✚　Create</button></nav>
<div class="navlabel">YOUR SPACE</div>
<nav class="nav"><button data-page="profile">◉　Profile</button><button data-page="achievements">♛　Achievements</button><button data-page="settings">⚙　Settings</button></nav>
<div class="sidebox"><b>Make something awesome.</b><p>Your next big game idea starts with one small block.</p><button class="btn primary" data-go="create">Start creating →</button></div>
</aside>
<main class="main">
<header class="topbar"><div class="mobilebrand">🧱 PlayBlocks</div><input class="search" id="search" placeholder="⌕  Search games..."><div class="topright"><button class="iconbtn" id="theme">☼</button><button class="userbtn" data-go="profile"><span id="topAvatar">P</span> <span id="topName">Player</span></button></div></header>
<div class="content" id="content"></div>
</main></div>
<nav class="mobile-nav"><button class="active" data-page="home"><b>⌂</b>Home</button><button data-page="games"><b>▦</b>Games</button><button data-page="favorites"><b>☆</b>Saved</button><button data-page="create"><b>✚</b>Create</button><button data-page="profile"><b>◉</b>Profile</button></nav>
<div class="modalbg hidden" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const starter=[
{id:"block-run",title:"Block Run",desc:"Dash through a colorful blocky world and beat your best distance.",category:"Adventure",emoji:"🏃",art:"blue"},
{id:"crystal-cave",title:"Crystal Cave",desc:"Explore a glowing cave full of secrets and sparkling crystals.",category:"Explore",emoji:"💎",art:"purple"},
{id:"sky-builder",title:"Sky Builder",desc:"Dream up a floating island and build it block by block.",category:"Creative",emoji:"🏝️",art:"cyan"},
{id:"pixel-pets",title:"Pixel Pets",desc:"Meet tiny pixel friends and create a cozy little home.",category:"Casual",emoji:"🐾",art:"pink"},
{id:"lava-escape",title:"Lava Escape",desc:"Find your route across the platforms and beat the challenge.",category:"Challenge",emoji:"🌋",art:"orange"},
{id:"gem-match",title:"Gem Match",desc:"Match colorful gems and chase a new high score.",category:"Puzzle",emoji:"🧩",art:"green"}];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem("pb_"+k))??d}catch{return d}},save=(k,v)=>localStorage.setItem("pb_"+k,JSON.stringify(v));
let profile=load("profile",{name:"Player",bio:"Ready to explore PlayBlocks!",avatar:"P"}),favorites=load("favorites",[]),custom=load("custom",[]),plays=load("plays",0),page="home",query="";
const games=()=>[...custom,...starter],esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2000)}
function card(g){return '<article class="game"><div class="art '+esc(g.art||"purple")+'"><span>'+esc(g.emoji||"🧱")+'</span></div><div class="gamebody"><h3>'+esc(g.title)+'</h3><p>'+esc(g.desc)+'</p><div class="gamefoot"><span class="tag">'+esc(g.category)+'</span><div><button class="play" data-play="'+esc(g.id)+'">PLAY</button> <button class="fav" data-fav="'+esc(g.id)+'">'+(favorites.includes(g.id)?"★":"☆")+'</button></div></div></div></article>'}
function head(t,d){return '<div class="pagehead"><div class="eyebrow">PLAYBLOCKS</div><h1>'+t+'</h1><p>'+d+'</p></div>'}
function render(){
document.getElementById("topName").textContent=profile.name;document.getElementById("topAvatar").textContent=profile.avatar||profile.name[0].toUpperCase();
document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
let out="";
if(page==="home"){out='<section class="hero"><div><div class="eyebrow">YOUR NEXT ADVENTURE STARTS HERE</div><h1>Play more.<br>Imagine bigger.</h1><p>Discover fun games, explore new worlds, and bring your own ideas to life with PlayBlocks.</p><button class="btn primary" data-go="games">Explore games →</button> <button class="btn" data-go="create">＋ Create a game</button></div></section><div class="stats"><div class="stat"><b>'+games().length+'</b><span>Games to discover</span></div><div class="stat"><b>'+plays+'</b><span>Games opened</span></div><div class="stat"><b>'+custom.length+'</b><span>Your creations</span></div></div><div class="sectionhead"><h2>Featured games</h2><button data-go="games">See all →</button></div><div class="grid">'+starter.slice(0,3).map(card).join("")+'</div><div class="sectionhead"><h2>Made by you</h2><button data-go="create">Create →</button></div><div class="grid">'+(custom.length?custom.slice(0,3).map(card).join(""):'<div class="empty">Your creations will appear here. Start with the Create page!</div>')+'</div>'}
else if(page==="games"){let a=games().filter(g=>(g.title+" "+g.desc+" "+g.category).toLowerCase().includes(query));out=head("Explore games","Find something fun to play.")+'<div class="sectionhead"><h2>'+(query?"Search results":"All games")+'</h2><span class="tag">'+a.length+' games</span></div><div class="grid">'+(a.length?a.map(card).join(""):'<div class="empty">No games found. Try another search.</div>')+'</div>'}
else if(page==="favorites"){let a=games().filter(g=>favorites.includes(g.id));out=head("Your favorites","The games you have saved for later.")+'<div class="grid">'+(a.length?a.map(card).join(""):'<div class="empty">No favorites yet. Tap ☆ on a game to save it here.</div>')+'</div>'}
else if(page==="create"){out=head("Create something","Publish a game idea to your personal PlayBlocks library.")+'<div class="panel"><h3>🧱 Game creator</h3><p class="muted">Create a game listing for your own idea. This starter version saves your creations on this device; a playable game editor can be added later.</p><form id="createForm"><div class="field"><label>Game name</label><input id="gtitle" maxlength="32" placeholder="My awesome game" required></div><div class="field"><label>Description</label><textarea id="gdesc" maxlength="140" placeholder="What can players do in your game?" required></textarea></div><div class="row"><div class="field"><label>Category</label><select id="gcat"><option>Adventure</option><option>Creative</option><option>Challenge</option><option>Puzzle</option><option>Casual</option><option>Explore</option></select></div><div class="field"><label>Game icon</label><select id="gemoji"><option>🧱</option><option>🚀</option><option>🐉</option><option>💎</option><option>🏝️</option><option>🎮</option><option>🌋</option><option>🐾</option></select></div></div><button class="btn primary">＋ Publish game</button></form></div><div class="sectionhead"><h2>Your published games</h2></div><div class="grid">'+(custom.length?custom.map(card).join(""):'<div class="empty">You have not published any games yet.</div>')+'</div>'}
else if(page==="profile"){out=head("Your profile","Make your PlayBlocks profile yours.")+'<div class="panel"><div style="display:flex;align-items:center;gap:15px"><div class="avatar" id="bigavatar">'+esc(profile.avatar)+'</div><div><h2>'+esc(profile.name)+'</h2><span class="tag">PLAYBLOCKS PLAYER</span></div></div><form id="profileForm"><div class="field"><label>Display name</label><input id="pname" maxlength="20" value="'+esc(profile.name)+'" required></div><div class="field"><label>Avatar letter or emoji</label><input id="pavatar" maxlength="4" value="'+esc(profile.avatar)+'"></div><div class="field"><label>Bio</label><textarea id="pbio" maxlength="120">'+esc(profile.bio)+'</textarea></div><button class="btn primary">Save profile</button></form></div><div class="stats"><div class="stat"><b>'+plays+'</b><span>Games opened</span></div><div class="stat"><b>'+custom.length+'</b><span>Created</span></div><div class="stat"><b>'+favorites.length+'</b><span>Favorites</span></div></div>'}
else if(page==="achievements"){let a=[["🎮","First steps","Open your first game.",plays>=1],["🧱","Creator","Publish your first game.",custom.length>=1],["⭐","Collector","Save three favorite games.",favorites.length>=3],["🏅","Explorer","Open five games.",plays>=5]];out=head("Achievements","Little milestones from your PlayBlocks journey.")+'<div class="panel">'+a.map(x=>'<div class="achievement"><div class="medal">'+x[0]+'</div><div><b>'+x[1]+'</b><br><small class="muted">'+x[2]+'</small></div><span class="tag" style="margin-left:auto">'+(x[3]?"UNLOCKED":"LOCKED")+'</span></div>').join("")+'</div>'}
else if(page==="settings"){out=head("Settings","Adjust your PlayBlocks experience.")+'<div class="panel"><h3>Appearance</h3><p class="muted">Choose the look that feels right.</p><button class="btn" id="theme2">☼ Toggle light / dark theme</button></div><div class="panel"><h3>Local data</h3><p class="muted">Your profile, favorites, and creations are saved in this browser on this device. They are not synced to other devices yet.</p><button class="btn" id="export">Export my data</button> <button class="btn" id="reset" style="color:#ff9bb8">Reset local data</button></div><div class="panel"><h3>About PlayBlocks</h3><p class="muted">A game discovery and creation project. Online accounts, multiplayer, and community features can be added in future updates.</p><span class="tag">VERSION 1.0</span></div>'}
document.getElementById("content").innerHTML=out}
function go(p){page=p;query="";document.getElementById("search").value="";render();window.scrollTo(0,0)}
function modal(g){plays++;save("plays",plays);document.getElementById("modal").innerHTML='<div class="modalhead"><h2>'+esc(g.title)+'</h2><button class="close" id="close">✕</button></div><div class="art '+esc(g.art||"purple")+'" style="border-radius:14px;margin:17px 0"><span>'+esc(g.emoji||"🧱")+'</span></div><p>'+esc(g.desc)+'</p><div class="panel"><b>Game preview</b><p class="muted">This is a game listing in the PlayBlocks starter hub. The playable game can be connected here in a future update.</p><span class="tag">'+esc(g.category)+'</span></div><button class="btn primary" id="done" style="width:100%">Back to PlayBlocks</button>';document.getElementById("modalbg").classList.remove("hidden");document.getElementById("done").onclick=()=>{document.getElementById("modalbg").classList.add("hidden");render();toast("Added to your play history!")};document.getElementById("close").onclick=()=>document.getElementById("modalbg").classList.add("hidden")}
document.addEventListener("click",e=>{
let p=e.target.closest("[data-page]");if(p)return go(p.dataset.page);
let d=e.target.closest("[data-go]");if(d)return go(d.dataset.go);
let pl=e.target.closest("[data-play]");if(pl){let g=games().find(x=>x.id===pl.dataset.play);if(g)modal(g);return}
let f=e.target.closest("[data-fav]");if(f){let id=f.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save("favorites",favorites);render();toast(favorites.includes(id)?"Added to favorites":"Removed from favorites");return}
if(e.target.id==="theme"||e.target.id==="theme2"){document.body.classList.toggle("light");save("light",document.body.classList.contains("light"))}
if(e.target.id==="close")document.getElementById("modalbg").classList.add("hidden");
if(e.target.id==="export"){let blob=new Blob([JSON.stringify({profile,favorites,custom,plays},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="playblocks-data.json";a.click();URL.revokeObjectURL(a.href)}
if(e.target.id==="reset"&&confirm("Reset PlayBlocks data on this device? This cannot be undone.")){Object.keys(localStorage).filter(k=>k.startsWith("pb_")).forEach(k=>localStorage.removeItem(k));location.reload()}
});
document.addEventListener("submit",e=>{
if(e.target.id==="createForm"){e.preventDefault();custom.unshift({id:"custom-"+Date.now(),title:document.getElementById("gtitle").value.trim(),desc:document.getElementById("gdesc").value.trim(),category:document.getElementById("gcat").value,emoji:document.getElementById("gemoji").value,art:["purple","blue","green","orange"][custom.length%4]});save("custom",custom);render();toast("Your game has been published!")}
if(e.target.id==="profileForm"){e.preventDefault();profile={name:document.getElementById("pname").value.trim()||"Player",avatar:document.getElementById("pavatar").value.trim()||"P",bio:document.getElementById("pbio").value.trim()};save("profile",profile);render();toast("Profile saved!")}
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();page="games";render();document.getElementById("search").focus();document.getElementById("search").setSelectionRange(e.target.value.length,e.target.value.length)});
document.getElementById("theme").addEventListener("click",()=>{document.body.classList.toggle("light");save("light",document.body.classList.contains("light"))});
if(load("light",false))document.body.classList.add("light");render();
</script>
</body></html>
